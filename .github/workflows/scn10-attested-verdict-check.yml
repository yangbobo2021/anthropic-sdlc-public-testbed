name: SCN-10 trusted verdict publisher
on:
  push:
    branches: [codex/scn10-verdict-publisher]
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the bound verdict and publish its check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 test-fixtures/scn10-attest/publish.py
