name: Synthetic protected-policy controls
on:
  pull_request:
    paths:
      - .github/workflows/policy-proof.yml
      - fixtures/deployment/**
      - policy/deployment.rego
permissions:
  contents: read
jobs:
  requested-private:
    uses: ./.github/workflows/infra-checks.yml
    with:
      manifest: fixtures/deployment/allowed.json
  requested-public:
    uses: ./.github/workflows/infra-checks.yml
    with:
      manifest: fixtures/deployment/denied.json
