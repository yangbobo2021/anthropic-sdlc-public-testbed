name: Publish a sandbox merge policy check as the GitHub Actions App
on:
  pull_request_target:
    branches: [policy-sandbox]
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  checks: write
jobs:
  publish:
    if: github.repository == github.event.pull_request.head.repo.full_name && startsWith(github.event.pull_request.head.ref, 'codex/policy-gate-fixture-')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Evaluate trusted fixture evidence on the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 test-fixtures/merge-gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandbox-merge-gate
          path: artifacts/merge-gate.json
          if-no-files-found: error
