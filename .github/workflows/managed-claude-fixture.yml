name: Verify Claude Code managed policy sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Claude Code and synthetic managed configuration
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --prefix "$RUNNER_TEMP/sdlc-cli" --no-audit --no-fund @anthropic-ai/claude-code@2.1.332
          echo "$RUNNER_TEMP/sdlc-cli/bin" >> "$GITHUB_PATH"
          fixture=test-fixtures/managed-claude
          sudo install -d /etc/claude-code /opt/company/sdlc
          jq -s '.[0] * .[1]' "$fixture/managed-settings.example.json" "$fixture/mcp-managed-settings.example.json" > "$RUNNER_TEMP/managed-settings.json"
          sudo install -m 644 "$RUNNER_TEMP/managed-settings.json" /etc/claude-code/managed-settings.json
          sudo install -m 644 "$fixture/managed-mcp.example.json" /etc/claude-code/managed-mcp.json
          sudo install -m 644 "$fixture/"{managed_write_scope.py,knowledge_mcp.py,approved-knowledge.json} /opt/company/sdlc/
      - name: Execute the native CLI with deterministic synthetic tool calls
        run: python3 test-fixtures/managed-claude/probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: managed-claude-receipts
          path: artifacts/managed-claude/
          if-no-files-found: warn
