name: Check the merge group commit
'on':
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Run reference check
      run: |-
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        make ci
