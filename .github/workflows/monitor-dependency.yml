name: Monitor dependency evidence
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sdlc-monitor-dependency]
permissions:
  contents: read
jobs:
  correlate:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Collect and correlate authorized feed
      run: |
        umask 077
        input=$(mktemp)
        trap 'rm -f "$input"' EXIT
        mkdir -p artifacts
        make -s monitor-dependency-feed > "$input"
        python3 scripts/sdlc/monitor_receipts.py dependency .github/sdlc/monitor-dependency.json "$input" > artifacts/monitor-dependency.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: monitor-dependency
        path: artifacts/monitor-dependency.json
        if-no-files-found: error
