name: CodeQL static analysis
'on':
  pull_request:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
      with:
        languages: javascript-typescript
        build-mode: none
    - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
      with:
        output: artifacts/sarif
    - name: Preserve the SARIF evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sast-sarif
        path: artifacts/sarif
        if-no-files-found: error
