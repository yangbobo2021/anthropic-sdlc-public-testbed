name: End-to-end regression
'on':
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Exercise a running HTTP service
      run: python3 tests/e2e/test_http_smoke.py --scenario .github/sdlc/e2e-smoke.json -- make e2e-serve
    - name: Store test result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: e2e-result
        path: artifacts/e2e.json
        if-no-files-found: error
